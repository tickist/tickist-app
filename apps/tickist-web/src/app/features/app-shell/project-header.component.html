<header class="project-header">
  <div class="project-header__text">
    <div class="project-header__title-row">
      <span class="project-header__icon" [style.color]="project.color">
        <app-project-icon [icon]="project.icon" [size]="28"></app-project-icon>
      </span>
      <h1>{{ project.name }}</h1>
    </div>
    @if (project.description) {
    <p class="project-desc">{{ project.description }}</p>
    }
    <div class="project-header__meta">
      <button
        type="button"
        class="project-header__suspended"
        data-testid="project-suspended-count"
        title="Show suspended tasks"
        [class.active]="filter === 'suspended'"
        [attr.aria-pressed]="filter === 'suspended'"
        (click)="selectFilter('suspended')"
      >
        <app-icon name="pause" />
        Suspended: {{ suspendedCount }}
      </button>
      @if (hasTime()) {
      <span
        class="project-header__time"
        [class.project-header__time--over]="(timePercent() ?? 0) > 100"
        data-testid="project-time-summary"
        [attr.title]="
          timePercent() === null
            ? null
            : timePercent() + '% of the estimate used'
        "
      >
        <app-icon name="time" />
        {{ timeLabel() }} @if (timePercent(); as percent) {
        <span
          class="project-header__time-bar"
          aria-hidden="true"
          [style.width.%]="percent > 100 ? 100 : percent"
        ></span>
        }
      </span>
      }
    </div>
  </div>

  <div class="project-header__actions">
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-circle"
      title="Edit project"
      aria-label="Edit project"
      (click)="openEdit.emit()"
    >
      <app-icon name="edit" size="18" />
    </button>

    <div class="dropdown dropdown-end" [class.dropdown-open]="sortOpen()">
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-circle"
        title="Sort"
        aria-label="Sort"
        (click)="sortOpen.set(!sortOpen())"
        tabindex="0"
      >
        <app-icon name="sort" size="18" />
      </button>
      <ul
        class="dropdown-content menu w-56 rounded-2xl border border-white/10 bg-base-200 text-base-content shadow-xl shadow-black/40"
      >
        <li
          class="menu-title px-3 pt-3 pb-1 text-xs uppercase tracking-[0.3em] text-base-content/70"
        >
          Sort by
        </li>
        @for (option of sortOptions; track option) {
        <li>
          <button
            type="button"
            class="sort-option"
            [class.active]="sort === option.value"
            (click)="selectSort(option.value)"
            [attr.aria-pressed]="sort === option.value"
          >
            <span
              class="sort-dot"
              [class.active]="sort === option.value"
            ></span>
            <span>{{ option.label }}</span>
          </button>
        </li>
        }
      </ul>
    </div>

    <div class="dropdown dropdown-end" [class.dropdown-open]="filterOpen()">
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-circle"
        title="Filter"
        aria-label="Filter"
        (click)="filterOpen.set(!filterOpen())"
        tabindex="0"
      >
        <app-icon name="filter" size="18" />
      </button>
      <ul
        class="dropdown-content menu w-56 rounded-2xl border border-white/10 bg-base-200 text-base-content shadow-xl shadow-black/40"
      >
        <li
          class="menu-title px-3 pt-3 pb-1 text-xs uppercase tracking-[0.3em] text-base-content/70"
        >
          Filter by
        </li>
        @for (option of filterOptions; track option) {
        <li>
          <button
            type="button"
            class="filter-option"
            [class.active]="filter === option.value"
            (click)="selectFilter(option.value)"
            [attr.aria-pressed]="filter === option.value"
          >
            <span
              class="filter-dot"
              [class.active]="filter === option.value"
            ></span>
            <span>{{ option.label }}</span>
          </button>
        </li>
        }
      </ul>
    </div>

    <app-simple-view-toggle
      [checked]="viewMode === 'simple'"
      (changed)="toggleSimple.emit($event)"
    />
  </div>
</header>
