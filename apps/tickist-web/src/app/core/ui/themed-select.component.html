<select
  #select
  [id]="controlId || null"
  class="themed-select"
  [class.themed-select--compact]="compact"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel"
  (change)="onSelectChange(select.selectedIndex)"
  (blur)="onBlur()"
>
  @for (option of options; track $index) {
  <option [value]="$index" [selected]="option.value === selectedValue()">
    {{ option.label }}
  </option>
  }
</select>
